<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#2563eb;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0ea5e9;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#38bdf8;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0ea5e9;stop-opacity:1" />
    </linearGradient>
  </defs>

  <!-- Background circle -->
  <circle cx="100" cy="100" r="100" fill="url(#bgGrad)"/>

  <!-- Decorative elements -->
  <circle cx="100" cy="100" r="60" fill="none" stroke="url(#accentGrad)" stroke-width="2" opacity="0.3"/>
  <circle cx="100" cy="100" r="40" fill="none" stroke="url(#accentGrad)" stroke-width="1" opacity="0.2"/>

  <!-- Person silhouette -->
  <g fill="white" opacity="0.95">
    <!-- Head -->
    <circle cx="100" cy="70" r="28"/>

    <!-- Body/shoulders -->
    <path d="M 100 98 Q 140 98 140 150 L 60 150 Q 60 98 100 98 Z"/>

    <!-- Subtle detail -->
    <ellipse cx="100" cy="145" rx="35" ry="5" fill="url(#accentGrad)" opacity="0.3"/>
  </g>

  <!-- Initials placeholder -->
  <text x="100" y="76" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif"
        font-size="32" font-weight="600" fill="url(#bgGrad)" text-anchor="middle" dominant-baseline="middle">
    HV
  </text>
</svg>